/* ===== GeoSpace editorial dashboard skin (reference-inspired) ===== */
:root{
  --bg:#f4f4f3; --panel:#ffffff; --panel2:#f8f8f7;
  --text:#202124; --muted:#777b80; --line:#ececec;
  --accent:#ff9818; --accent2:#fff0dc; --danger:#d94b4b; --good:#16865b;
  --shadow:0 8px 26px rgba(20,20,20,.055);
}
[data-theme="dark"]{
  --bg:#151515; --panel:#202020; --panel2:#282828;
  --text:#f4f4f4; --muted:#aaa; --line:#373737;
  --accent:#ffa329; --accent2:#49331b; --danger:#ff7777; --good:#56c99a;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}
html,body{min-height:100%;background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
.app{background:var(--bg);grid-template-rows:66px minmax(0,1fr)}
.topbar{
  padding:0 24px;background:var(--panel);border:0;
  box-shadow:0 2px 12px rgba(0,0,0,.025);gap:18px
}
.brand{font-size:17px;gap:12px}
.brand>span{background:none;color:var(--text);-webkit-text-fill-color:var(--text);font-weight:800;letter-spacing:-.045em}
.geospace-logo{filter:none;color:#111}
.top-actions button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--panel2)}
.top-actions button:hover{background:var(--accent2);color:var(--text);transform:translateY(-2px)}
.status{font-size:11px;letter-spacing:.01em}
.layout{grid-template-columns:76px minmax(0,1fr) 276px;gap:0;background:var(--bg)}
.nav{
  margin:12px 0 12px 12px;padding:12px 9px;
  background:#101010;border:0;border-radius:22px;overflow:visible;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  box-shadow:0 10px 28px rgba(0,0,0,.12);z-index:2
}
.nav-label{display:none}
.nav button{
  position:relative;width:48px;height:48px;min-width:48px;padding:0;margin:0;
  display:grid;place-items:center;border:0;border-radius:15px;
  color:#d9d9d9;background:transparent;transition:background .2s,transform .2s,color .2s
}
.nav button .ico{width:22px;height:22px;display:grid;place-items:center}
.nav button .ico .icon{width:20px;height:20px}
.nav button span:last-child{display:none}
.nav button:hover{background:#292929;color:white;transform:scale(1.04)}
.nav button.active{
  background:#fff;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.16);
  transform:translateX(5px);border-radius:15px 7px 7px 15px
}
.nav button.active .icon{stroke:#111}
.nav button::after{
  content:attr(title);position:absolute;left:58px;top:50%;transform:translate(5px,-50%);
  background:#171717;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;
  padding:7px 10px;border-radius:7px;opacity:0;pointer-events:none;transition:.16s;z-index:20
}
.nav button:hover::after{opacity:1;transform:translate(0,-50%)}
.main{margin:12px 10px 12px 14px;min-height:0;background:transparent}
.pagehead{
  padding:19px 22px 14px;min-height:76px;background:var(--panel);
  border-radius:17px 17px 0 0;align-items:center
}
.pagehead h1{font-size:21px;font-weight:750;letter-spacing:-.045em}
.pagehead h1:after{display:none}
.pagehead p{font-size:12px;color:var(--muted);margin-top:5px}
.pagehead button{border-radius:9px}
.page-content{
  max-width:none;width:100%;margin:0;padding:4px 22px 24px;
  background:var(--panel);border-radius:0 0 17px 17px;min-height:calc(100% - 76px)
}
.workspace{padding:0 12px 12px}
.toolbar{
  border:0;border-radius:13px;background:var(--panel);box-shadow:0 3px 14px rgba(0,0,0,.035);
  padding:9px;gap:6px
}
.tool-group{border-color:var(--line)}
.tool{background:var(--panel2);border:0;border-radius:8px;color:var(--text)}
.tool.active{background:#171717;color:white;border:0}
[data-theme="dark"] .tool.active{background:#f3f3f3;color:#111}
.canvas-wrap{border:0;border-radius:15px;background:var(--panel);box-shadow:0 5px 20px rgba(0,0,0,.045)}
.side{
  margin:12px 12px 12px 4px;padding:15px;background:transparent;
  border:0;display:block;overflow:auto
}
.side .section,.side>div:last-child{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:15px;margin:0 0 11px;box-shadow:0 3px 14px rgba(0,0,0,.025)
}
.side h3{font-size:12px;font-weight:750;letter-spacing:-.01em}
.side .object{border:0;border-radius:9px;background:var(--panel2);padding:9px}
.panel-card,.enh-card,.about-card{
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
  box-shadow:0 4px 18px rgba(0,0,0,.035);padding:16px
}
.enh-grid{gap:13px}
.enh-card h3,.panel-card h2{font-size:15px;font-weight:750}
.formula{border-radius:9px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel2)}
.formula-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:transform .2s,box-shadow .2s}
.formula-card:hover,.enh-card:hover,.panel-card:hover{transform:translateY(-2px);box-shadow:0 9px 25px rgba(0,0,0,.07)}
button{border-radius:9px;box-shadow:none}
button:hover{box-shadow:0 4px 12px rgba(0,0,0,.07);transform:translateY(-1px)}
button.primary,.enh-actions .primary{
  background:#151515;color:white;border-color:#151515;box-shadow:none
}
button.primary:hover,.enh-actions .primary:hover{background:#333;border-color:#333}
[data-theme="dark"] button.primary,[data-theme="dark"] .enh-actions .primary{background:#f3f3f3;color:#111;border-color:#f3f3f3}
button.active{background:var(--accent2);color:var(--text);border-color:var(--accent)}
input,select{border-radius:8px;border-color:var(--line);background:var(--panel2)}
.project-row{border:1px solid var(--line);border-radius:11px;background:var(--panel);transition:.2s}
.project-row:hover{border-color:#f3b35e;transform:translateY(-1px)}
.calc-display{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.keypad button{border:0;background:var(--panel2);border-radius:10px}
.keypad button[data-key="="]{background:#151515;color:#fff}
[data-theme="dark"] .keypad button[data-key="="]{background:#f3f3f3;color:#111}
.toast{background:#171717;border-radius:10px}
.about-card{border-radius:18px}
.pill{background:var(--accent2);color:var(--text);border-radius:30px}
.pagehead,.page-content,.panel-card,.enh-card,.side .section,.canvas-wrap{
  animation:dashboardIn .38s ease both
}
@keyframes dashboardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1050px){
  .layout{grid-template-columns:70px minmax(0,1fr)}
  .side{display:none}
}
@media(max-width:700px){
  body{height:auto;overflow:auto}
  .app{height:auto;min-height:100vh;grid-template-rows:58px 1fr}
  .topbar{padding:0 12px}
  .layout{display:flex;flex-direction:column}
  .nav{
    order:0;position:sticky;top:0;z-index:10;margin:0;padding:6px 8px;
    width:100%;height:58px;border-radius:0;flex-direction:row;justify-content:flex-start;
    overflow-x:auto;box-shadow:0 3px 12px rgba(0,0,0,.08)
  }
  .nav button{width:43px;height:43px;min-width:43px}
  .nav button.active{transform:translateY(-2px);border-radius:12px}
  .nav button::after{display:none}
  .main{margin:9px 8px 12px;min-height:calc(100vh - 130px)}
  .pagehead{padding:15px 14px 10px}
  .page-content{padding:4px 14px 18px}
  .workspace{padding:0 8px 10px}
  .canvas-wrap{min-height:55vh}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== end dashboard skin ===== */

<script>
(() => {
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const main=$('#main'),side=$('#side'),toastEl=$('#toast');
let page='home',theme=(localStorage.getItem('mgg-theme')==='dark'?'dark':'light');
let mode='point',points=[],lines=[],circles=[],polygons=[],angleMarks=[],selected=null,dragging=null,labelCounter=0;
let history=[],future=[],grid=true,axes=false,snap=false,showLabels=true,zoom=1,pan={x:0,y:0},lastPointer=null;
let graphFns=['y=2*x+1','y=x^2'];
let calcExpr='0',calcAns='0';
let projectName='Untitled construction';
const colors=['#2563eb','#16a34a','#ea580c','#9333ea','#db2777'];
function notify(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
function setTheme(t){
  theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('mgg-theme', theme); } catch (err) {}
  const btn = $('#themeBtn');
  if (btn) {
    btn.innerHTML = theme === 'dark'
      ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'
      : '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5a8.5 8.5 0 1 0 12 12Z"/></svg>';
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    btn.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  }
}
setTheme(theme);
function snapshot(){return JSON.stringify({points,lines:lines.map(l=>[points.indexOf(l.a),points.indexOf(l.b)]),circles:circles.map(c=>[points.indexOf(c.c),points.indexOf(c.edge)]),polygons:polygons.map(p=>p.map(x=>points.indexOf(x))),angleMarks:angleMarks.map(a=>[points.indexOf(a.a),points.indexOf(a.b),points.indexOf(a.c),a.value]),labelCounter})}
function saveHistory(){history.push(snapshot());if(history.length>60)history.shift();future=[];updateUndo()}
function restore(s){let d=JSON.parse(s);points=d.points;lines=d.lines.map(([a,b])=>({a:points[a],b:points[b]}));circles=d.circles.map(([a,b])=>({c:points[a],edge:points[b]}));polygons=d.polygons.map(a=>a.map(i=>points[i]));angleMarks=(d.angleMarks||[]).map(([a,b,c,value])=>({a:points[a],b:points[b],c:points[c],value}));labelCounter=d.labelCounter;draw();renderObjects()}
function undo(){if(!history.length)return;future.push(snapshot());restore(history.pop());updateUndo()}
function redo(){if(!future.length)return;history.push(snapshot());restore(future.pop());updateUndo()}
function updateUndo(){$('#undoBtn').disabled=!history.length;$('#redoBtn').disabled=!future.length}
function label(){let n=labelCounter++,s='';do{s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1}while(n>=0);return s}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)/40}
function coords(p){return `(${((p.x-pan.x)/(40*zoom)).toFixed(2)}, ${((p.y-pan.y)/(40*zoom)).toFixed(2)})`}

function renderHome(){
 side.innerHTML='';
 main.innerHTML=`<section class="home-hero">
  <div class="home-hero-copy"><span class="home-eyebrow">WELCOME TO YOUR MATH SPACE</span>
   <h1>Explore. Create. <em>Understand.</em></h1>
   <p>Bring mathematics to life with interactive geometry, dynamic graphs, 3D models and a library of formulas.</p>
   <button class="home-primary" data-go="geometry">Open Geometry Studio <span>↗</span></button>
  </div>
  <div class="home-hero-art" aria-hidden="true"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div>
   <div class="hero-glass hero-cube"><span></span></div><div class="hero-glass hero-sphere"></div><div class="hero-glass hero-ring"></div>
  </div>
 </section>
 <div class="home-section-head"><div><span class="home-eyebrow">YOUR WORKSPACE</span><h2>What would you like to explore?</h2></div><span class="home-subtle">Choose a studio to get started</span></div>
 <section class="home-launch-grid">
  <button class="home-launch" data-go="geometry"><span class="launch-icon"><svg viewBox="0 0 48 48"><path d="M8 38 38 8v30H8Z"/><path d="m15 31 8-8 7 7"/></svg></span><b>Geometry Studio</b><small>Construct shapes, lines and angles</small><i>Open studio ↗</i></button>
  <button class="home-launch" data-go="graph"><span class="launch-icon"><svg viewBox="0 0 48 48"><path d="M7 7v34h34"/><path d="m13 31 9-10 8 6 10-16"/></svg></span><b>Graphing Studio</b><small>Plot and compare functions</small><i>Explore graphs ↗</i></button>
  <button class="home-launch" data-go="studio3d"><span class="launch-icon"><svg viewBox="0 0 48 48"><path d="m24 5 17 10v19L24 43 7 34V15L24 5Z"/><path d="m7 15 17 10 17-10M24 25v18"/></svg></span><b>3D Shape Studio</b><small>Build, rotate and inspect solids</small><i>View 3D models ↗</i></button>
  <button class="home-launch" data-go="formulas"><span class="launch-icon"><svg viewBox="0 0 48 48"><path d="M36 8H12l15 16-15 16h24"/></svg></span><b>Formula Library</b><small>Discover formulas and derivations</small><i>Browse formulas ↗</i></button>
  <button class="home-launch" data-go="projects"><span class="launch-icon"><svg viewBox="0 0 48 48"><path d="M6 14a4 4 0 0 1 4-4h10l5 5h13a4 4 0 0 1 4 4v18H6V14Z"/></svg></span><b>My Projects</b><small>Continue your saved constructions</small><i>Open projects ↗</i></button>
  <button class="home-launch" data-go="help"><span class="launch-icon"><svg viewBox="0 0 48 48"><path d="m5 17 19-10 19 10-19 10L5 17Z"/><path d="M12 22v11c7 7 17 7 24 0V22m7-5v15"/></svg></span><b>Guide & Shortcuts</b><small>Learn tools and useful shortcuts</small><i>Read the guide ↗</i></button>
 </section>
 <section class="home-bottom"><div><span class="home-eyebrow">A LITTLE REMINDER</span><h3>Math is better when you can play with it.</h3><p>Change a value, move a point, rotate a solid and see what happens.</p></div><div class="home-bottom-orb">π</div></section>`;
 $$('#main [data-go]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.go)));
}
function mountFloatingCalculator(){
 if($('#geoCalcFloat'))return;
 const wrap=document.createElement('div');wrap.id='geoCalcFloat';
 wrap.innerHTML=`<button id="geoCalcToggle" class="geo-calc-fab" title="Open scientific calculator" aria-label="Open scientific calculator"><svg viewBox="0 0 48 48"><rect x="9" y="5" width="30" height="38" rx="8"/><rect x="15" y="11" width="18" height="8" rx="2"/><path d="M16 26h4m8 0h4M16 33h4m8 0h4"/></svg><span>Calculator</span></button>
 <div class="geo-calc-pop" id="geoCalcPop" hidden><div class="geo-calc-head"><div><b>Scientific Calculator</b><small>Available on every page</small></div><button id="geoCalcClose" aria-label="Close calculator">×</button></div><div id="pageContent"></div></div>`;
 document.body.appendChild(wrap);
 $('#geoCalcToggle').onclick=()=>{const pop=$('#geoCalcPop');pop.hidden=!pop.hidden;if(!pop.hidden)renderCalculator()};
 $('#geoCalcClose').onclick=()=>$('#geoCalcPop').hidden=true;
}

function setPage(p){page=p;main.dataset.page=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderPage()}
$$('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function renderPage(){
  if(page==='home'){renderHome();return}
  if(page==='geometry'){renderGeometry();return}
  side.innerHTML='';
  const titles={graph:['Graphing Calculator','Plot and explore mathematical functions.'],formulas:['Formula Library','A quick reference for essential mathematics.'],projects:['My Projects','Save, reopen, import and export your constructions.'],help:['Guide & Shortcuts','Learn the tools and keyboard shortcuts.'],about:['About GeoSpace','A learning space built around curiosity, creativity and mathematics.']};
  let [title,sub]=titles[page];main.innerHTML=`<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div></div><div class="page-content" id="pageContent"></div>`;
  if(page==='graph')renderGraph();if(page==='formulas')renderFormulas();if(page==='projects')renderProjects();if(page==='help')renderHelp();if(page==='about')renderAbout();
}
function renderGeometry(){
main.innerHTML=`<div class="pagehead"><div><h1>Geometry Studio</h1><p>Construct, measure and explore dynamic geometry.</p></div><div style="margin-left:auto"><button id="newBtn">＋ New</button></div></div>
<div class="workspace">
<div class="toolbar">
 <div class="tool-group"><button class="tool active" data-mode="point"><svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> Point</button><button class="tool" data-mode="move"><svg class="icon" viewBox="0 0 24 24"><path d="M8 12V5a1.7 1.7 0 0 1 3.4 0v6-8a1.7 1.7 0 0 1 3.4 0v8-6a1.7 1.7 0 0 1 3.4 0v8-4a1.7 1.7 0 0 1 3.4 0v7c0 4-2.5 6-6 6h-3c-2 0-3.2-1-4.4-2.5L4 15a1.8 1.8 0 0 1 2.6-2.4L8 14"/></svg> Move</button></div>
 <div class="tool-group"><button class="tool" data-mode="segment"><svg class="icon" viewBox="0 0 24 24"><path d="M5 19 19 5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg> Segment</button><button class="tool" data-mode="line"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18m-5-5 5 5-5 5M8 7l-5 5 5 5"/></svg> Line</button><button class="tool" data-mode="ray"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20 20 4m-7 0h7v7"/></svg> Ray</button></div>
 <div class="tool-group"><button class="tool" data-mode="circle"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></svg> Circle</button><button class="tool" data-mode="polygon"><svg class="icon" viewBox="0 0 24 24"><path d="m12 3 8 6-3 10H7L4 9l8-6Z"/></svg> Polygon</button></div>
 <div class="tool-group"><button class="tool" data-mode="angle"><svg class="icon" viewBox="0 0 24 24"><path d="M5 19 5 5l14 14H5Z"/><path d="M9 15v-5h5"/></svg> Angle</button><button class="tool" data-mode="midpoint"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12h16"/><circle cx="12" cy="12" r="7"/></svg> Midpoint</button></div>
 <div class="tool-group"><button class="tool" data-mode="delete"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16l-1 14H5L4 7Z"/><path d="M9 7V4h6v3m-4 4v6m3-6v6"/></svg> Delete</button></div>
 <button class="tool" id="gridBtn"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/></svg> Grid</button><button class="tool" id="axesBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M12 3v18"/><path d="m17 8 4 4-4 4M8 7l4-4 4 4"/></svg> Axes</button><button class="tool" id="snapBtn"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg> Snap</button>
</div>
<div class="canvas-wrap"><canvas id="geoCanvas"></canvas><div class="canvas-hud" id="modeHint">POINT · Click canvas to create a point</div><div class="canvas-bottom"><span id="coordsHud">x: 0 · y: 0</span><span>Scroll to zoom · Drag points in Move mode</span></div></div>
</div>`;
side.innerHTML=`<div class="section"><h3>Construction Objects</h3><div class="small muted" id="objectCount">0 objects</div><div id="objectList"></div></div>
<div class="section"><h3>Selected object</h3><div id="selectedInfo" class="small muted">Select a point or construction to inspect it.</div></div>
<div class="section"><h3>View settings</h3><div class="field"><label>Label visibility</label><button id="labelsBtn">${showLabels?'Labels visible':'Labels hidden'}</button></div><div class="field"><label>Zoom</label><input id="zoomRange" type="range" min=".5" max="2.5" step=".1" value="${zoom}"></div></div>
<div><h3>Quick actions</h3><div class="grid2"><button id="undoSide">↶ Undo</button><button id="redoSide">↷ Redo</button><button id="exportPng">Download JPEG</button><button id="clearBtn" class="danger">Clear all</button></div></div>`;
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('#gridBtn').classList.toggle('active',grid);$('#axesBtn').classList.toggle('active',axes);$('#snapBtn').classList.toggle('active',snap);
$('#gridBtn').onclick=()=>{grid=!grid;renderGeometry()};
$('#axesBtn').onclick=()=>{axes=!axes;renderGeometry()};
$('#snapBtn').onclick=()=>{snap=!snap;renderGeometry()};
$('#labelsBtn').onclick=()=>{showLabels=!showLabels;renderGeometry();draw()};
$('#zoomRange').oninput=e=>{zoom=+e.target.value;draw()};
$('#undoSide').onclick=undo;$('#redoSide').onclick=redo;$('#clearBtn').onclick=clearAll;$('#newBtn').onclick=clearAll;$('#exportPng').onclick=exportPng;
setupCanvas();renderObjects();setMode(mode);updateUndo();
}
function setMode(m){mode=m;selected=null;$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));let hints={point:'POINT · Click canvas to create a point',move:'MOVE · Drag a point to reposition it',segment:'SEGMENT · Select two points',line:'LINE · Select two points',ray:'RAY · Select two points',circle:'CIRCLE · Select centre, then a point on circle',polygon:'POLYGON · Click 3+ positions, then click the first vertex to close',angle:'ANGLE · Click 3 positions: first arm, vertex, second arm',midpoint:'MIDPOINT · Select two points',delete:'DELETE · Click an object to remove it'};$('#modeHint').textContent=hints[m]||m.toUpperCase();draw()}
let canvas,ctx;
function setupCanvas(){canvas=$('#geoCanvas');ctx=canvas.getContext('2d');const resize=()=>{let r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()};new ResizeObserver(resize).observe(canvas);resize();canvas.onpointerdown=pointerDown;canvas.onpointermove=pointerMove;canvas.onpointerup=()=>{dragging=null};canvas.onpointerleave=()=>{dragging=null};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom+(e.deltaY<0?.1:-.1)));$('#zoomRange').value=zoom;draw()}}
function world(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-pan.x)/zoom,y:(e.clientY-r.top-pan.y)/zoom}}
function near(p){return points.find(x=>Math.hypot(x.x-p.x,x.y-p.y)<12/zoom)}
let construction=[];
function pointerDown(e){
 canvas.setPointerCapture(e.pointerId);
 let p=world(e),hit=near(p);
 lastPointer=p;
 if(mode==='move'){if(hit)dragging=hit;return}
 if(mode==='delete'){
  if(hit){
   saveHistory();
   points=points.filter(x=>x!==hit);
   lines=lines.filter(l=>l.a!==hit&&l.b!==hit);
   circles=circles.filter(c=>c.c!==hit&&c.edge!==hit);
   polygons=polygons.filter(poly=>!poly.includes(hit));
   angleMarks=angleMarks.filter(a=>a.a!==hit&&a.b!==hit&&a.c!==hit);
   draw();renderObjects();
  }
  return;
 }
 if(mode==='point'){
  if(!hit){saveHistory();points.push({x:snap?Math.round(p.x/40)*40:p.x,y:snap?Math.round(p.y/40)*40:p.y,label:label()});draw();renderObjects()}
  return;
 }
 if(mode==='polygon'||mode==='angle'){
  // For these two tools, a click on empty canvas creates a vertex automatically.
  // A click on an existing point reuses it.
  if(mode==='polygon'&&hit&&construction.length>=3&&hit===construction[0]){
   saveHistory();polygons.push([...construction]);construction=[];draw();renderObjects();notify('Polygon completed');return;
  }
  if(!hit){
   saveHistory();
   hit={x:snap?Math.round(p.x/40)*40:p.x,y:snap?Math.round(p.y/40)*40:p.y,label:label()};
   points.push(hit);
  }
  if(!construction.includes(hit)) construction.push(hit);
  else { notify('Choose a different point'); return; }

  if(mode==='angle'&&construction.length===3){
   const [a,b,c]=construction;
   const ab=Math.hypot(a.x-b.x,a.y-b.y),cb=Math.hypot(c.x-b.x,c.y-b.y);
   if(ab<1||cb<1){construction=[];notify('Choose three distinct points');draw();renderObjects();return}
   const ang=angleAt(a,b,c);
   saveHistory();
   angleMarks.push({a,b,c,value:ang});
   construction=[];
   notify(`∠${a.label}${b.label}${c.label} = ${ang}°`);
   draw();renderObjects();return;
  }
  draw();
  if(mode==='polygon'&&construction.length>=3) notify('Click the first vertex to close the polygon');
  if(mode==='angle') notify(`Select ${3-construction.length} more point${3-construction.length===1?'':'s'} (the vertex is second)`);
  return;
 }
 if(hit){if(!construction.includes(hit))construction.push(hit);else construction=[]}
 else if(mode==='midpoint'){saveHistory();let pt={x:p.x,y:p.y,label:label()};points.push(pt);construction=[];draw();renderObjects();return}
 if(construction.length===2){
  saveHistory();let [a,b]=construction;
  if(mode==='segment'||mode==='line'||mode==='ray')lines.push({a,b,type:mode});
  if(mode==='circle')circles.push({c:a,edge:b});
  if(mode==='midpoint'){let m={x:(a.x+b.x)/2,y:(a.y+b.y)/2,label:label()};points.push(m)}
  construction=[];draw();renderObjects()
 }
}

function safeMath(source,xValue=0){let s=String(source).replace(/^\s*y\s*=\s*/i,'').replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/');let tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[A-Za-z_]+|\*\*|[()+\-*/^%,]/gi)||[];if(tokens.join('').replace(/\s/g,'')!==s.replace(/\s/g,''))throw Error('Unsupported character');let i=0;const peek=()=>tokens[i],take=()=>tokens[i++];function atom(){let t=take();if(t===undefined)throw Error('Incomplete expression');if(t==='+')return atom();if(t==='-')return -atom();if(t==='('){let v=expr();if(take()!==')')throw Error('Missing )');return v}if(!isNaN(Number(t)))return Number(t);if(/^[A-Za-z_]+$/.test(t)){let n=t.toLowerCase();if(n==='x')return xValue;if(n==='pi')return Math.PI;if(n==='e')return Math.E;if(peek()==='('){take();let a=expr();if(take()!==')')throw Error('Missing )');let f={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,log:Math.log10,ln:Math.log,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh};if(!f[n])throw Error('Unknown function: '+n);return f[n](a)}throw Error('Unknown name: '+t)}throw Error('Unexpected token: '+t)}function power(){let a=atom();if(peek()==='^'||peek()==='**'){take();a=a**power()}return a}function term(){let a=power();while(['*','/','%'].includes(peek())){let op=take(),b=power();a=op==='*'?a*b:op==='/'?a/b:a%b}return a}function expr(){let a=term();while(peek()==='+'||peek()==='-'){let op=take(),b=term();a=op==='+'?a+b:a-b}return a}let v=expr();if(i!==tokens.length)throw Error('Unexpected token: '+peek());if(!Number.isFinite(v))throw Error('Result is not finite');return v}

function deriveFormula(f){
 const n=f.name.toLowerCase();
 const map={
 'triangle area':'Start with a rectangle/parallelogram of the same base b and height h. A diagonal divides it into two equal triangles. Therefore the triangle occupies half the area: A = (b×h)/2.',
 'rectangle area':'A rectangle contains l rows of unit length and w units across. Multiplying the perpendicular dimensions gives A = l×w.',
 'circle area':'Divide the circle into many narrow sectors and rearrange them alternately. The shape approaches a rectangle with height r and base half the circumference, πr. Thus A = πr×r = πr².',
 'circle circumference':'A circle’s circumference is proportional to its diameter. The constant ratio is π, so C=πd. Since d=2r, C=2πr.',
 'pythagorean theorem':'For a right triangle, construct squares on all three sides. The area of the square on the hypotenuse equals the sum of the areas on the two legs: c²=a²+b².',
 'quadratic roots':'For ax²+bx+c=0, divide by a and move the constant: x²+(b/a)x=−c/a. Complete the square by adding (b/2a)² to both sides, then take square roots and isolate x to obtain x=(−b±√(b²−4ac))/(2a).',
 'simple interest':'Interest is proportional to principal P, annual rate R and time T. For a rate expressed as a percentage, I=P×(R/100)×T=PRT/100.',
 'slope':'Slope is rise divided by run. Between (x₁,y₁) and (x₂,y₂), rise=y₂−y₁ and run=x₂−x₁, giving m=(y₂−y₁)/(x₂−x₁).',
 'distance':'Apply Pythagoras to the horizontal change x₂−x₁ and vertical change y₂−y₁. The straight-line distance is the square root of the sum of their squares.',
 'midpoint':'The midpoint is halfway along both coordinate directions. Average the x-coordinates and average the y-coordinates.',
 'power rule':'Write xⁿ as a product of n factors. Differentiation by the product rule yields n equal terms, each xⁿ⁻¹; hence d(xⁿ)/dx=nxⁿ⁻¹.',
 'mean':'The arithmetic mean distributes the total sum equally among n observations. Add all observations and divide by n.'
 };
 for(const [k,v] of Object.entries(map))if(n.includes(k))return v;
 if(f.cat==='Differentiation')return 'Use the limit definition f′(x)=lim(h→0)[f(x+h)−f(x)]/h, then simplify the difference quotient. Apply the relevant differentiation rule and state any domain restrictions.';
 if(f.cat==='Integration')return 'An indefinite integral reverses differentiation. Find a function whose derivative equals the integrand, then include the arbitrary constant of integration C.';
 if(f.cat==='Trigonometry')return 'Start from the unit-circle definitions and the sine/cosine addition identities. Rearrange the identity algebraically to obtain the stated relationship.';
 if(f.cat.includes('mensuration'))return 'Identify the defining dimensions and decompose the solid or plane region into familiar components. Substitute the dimensions into the area or volume relationship, preserving squared or cubed units.';
 return `Start from the definition of the quantities involved. Apply the relevant algebraic identity or geometric/statistical rule, simplify step by step, and check the conditions: ${f.variables}`;
}
function formulaInputs(f){const n=f.name.toLowerCase();
 if(n.includes('circle area')||n.includes('circumference')||n.includes('radius-diameter'))return [{key:'r',label:'Radius (r)',value:5}];
 if(n.includes('rectangle'))return [{key:'l',label:'Length (l)',value:8},{key:'w',label:'Width (w)',value:4}];
 if(n.includes('triangle area'))return [{key:'b',label:'Base (b)',value:10},{key:'h',label:'Height (h)',value:6}];
 if(n.includes('pythagorean'))return [{key:'a',label:'Side a',value:3},{key:'b',label:'Side b',value:4}];
 if(n.includes('slope'))return [{key:'x1',label:'x₁',value:2},{key:'y1',label:'y₁',value:3},{key:'x2',label:'x₂',value:6},{key:'y2',label:'y₂',value:11}];
 if(n.includes('distance'))return [{key:'x1',label:'x₁',value:1},{key:'y1',label:'y₁',value:2},{key:'x2',label:'x₂',value:4},{key:'y2',label:'y₂',value:6}];
 if(n.includes('midpoint'))return [{key:'x1',label:'x₁',value:1},{key:'y1',label:'y₁',value:2},{key:'x2',label:'x₂',value:5},{key:'y2',label:'y₂',value:8}];
 if(n.includes('simple interest'))return [{key:'p',label:'Principal (P)',value:1000},{key:'r',label:'Annual rate (%)',value:5},{key:'t',label:'Time (years)',value:2}];
 if(n.includes('quadratic'))return [{key:'a',label:'Coefficient a',value:1},{key:'b',label:'Coefficient b',value:-5},{key:'c',label:'Coefficient c',value:6}];
 if(n.includes('speed'))return [{key:'d',label:'Distance',value:100},{key:'t',label:'Time',value:2}];
 if(n.includes('volume')||f.cat==='3D mensuration')return [{key:'r',label:'Radius / side / length',value:3},{key:'h',label:'Height / width',value:5}];
 if(f.cat==='Trigonometry')return [{key:'angle',label:'Angle (degrees)',value:30},{key:'a',label:'Side a (if needed)',value:3},{key:'b',label:'Side b (if needed)',value:4}];
 return [{key:'a',label:'Input a',value:3},{key:'b',label:'Input b',value:4},{key:'c',label:'Input c',value:5}];
}
function calculateKnown(f,v){let n=f.name.toLowerCase(),z,sub='';
 if(n.includes('circle area')){z=Math.PI*v.r*v.r;sub=`π × ${v.r}²`;}
 else if(n.includes('circumference')){z=2*Math.PI*v.r;sub=`2π × ${v.r}`;}
 else if(n.includes('rectangle area')){z=v.l*v.w;sub=`${v.l} × ${v.w}`;}
 else if(n.includes('rectangle perimeter')){z=2*(v.l+v.w);sub=`2(${v.l}+${v.w})`;}
 else if(n.includes('triangle area')){z=v.b*v.h/2;sub=`½ × ${v.b} × ${v.h}`;}
 else if(n.includes('pythagorean')){z=Math.hypot(v.a,v.b);sub=`√(${v.a}²+${v.b}²)`;}
 else if(n.includes('slope')){if(v.x2===v.x1)throw Error('x₂ must differ from x₁.');z=(v.y2-v.y1)/(v.x2-v.x1);sub=`(${v.y2}−${v.y1})/(${v.x2}−${v.x1})`;}
 else if(n.includes('distance')){z=Math.hypot(v.x2-v.x1,v.y2-v.y1);sub=`√((${v.x2}−${v.x1})²+(${v.y2}−${v.y1})²)`;}
 else if(n.includes('midpoint')){z=`(${(v.x1+v.x2)/2}, ${(v.y1+v.y2)/2})`;sub=`((${v.x1}+${v.x2})/2, (${v.y1}+${v.y2})/2)`;}
 else if(n.includes('simple interest')){z=v.p*v.r*v.t/100;sub=`(${v.p}×${v.r}×${v.t})/100`;}
 else if(n.includes('quadratic')){if(!v.a)throw Error('a cannot be zero.');let D=v.b*v.b-4*v.a*v.c;z=D>=0?`${(-v.b+Math.sqrt(D))/(2*v.a)} and ${(-v.b-Math.sqrt(D))/(2*v.a)}`:`${-v.b/(2*v.a)} ± ${Math.sqrt(-D)/(2*v.a)}i`;sub=`Discriminant = ${D}; use (−b±√D)/(2a)`;}
 else if(n==='speed'){if(!v.t)throw Error('Time cannot be zero.');z=v.d/v.t;sub=`${v.d}/${v.t}`;}
 else if(n.includes('cube volume')){z=v.r**3;sub=`${v.r}³`;}
 else if(n.includes('sphere volume')){z=4*Math.PI*v.r**3/3;sub=`4π×${v.r}³/3`;}
 else if(n.includes('cylinder volume')){z=Math.PI*v.r*v.r*v.h;sub=`π×${v.r}²×${v.h}`;}
 else if(n.includes('cone volume')){z=Math.PI*v.r*v.r*v.h/3;sub=`π×${v.r}²×${v.h}/3`;}
 else if(n.includes('trigonometry')||f.cat==='Trigonometry'){let rad=v.angle*Math.PI/180;z=`sin=${Math.sin(rad).toFixed(6)}, cos=${Math.cos(rad).toFixed(6)}, tan=${Math.tan(rad).toFixed(6)}`;sub=`θ=${v.angle}°`}
 else {z='This entry is a reference identity. Use the displayed formula and its variable definitions to substitute values.';sub='No automatic evaluator is assigned to this general identity.'}
 return {sub,answer:typeof z==='number'?Number(z.toPrecision(10)).toString():z};
}

 }
